name: Update Work section

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - data/manual-work-cards.json
      - scripts/update-work-section.mjs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate Work section
        env:
          GITHUB_USER: 42sagiv
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: node scripts/update-work-section.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update Work section"
          git push
