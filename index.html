<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>42NAV — Telecom, Mobility &amp; Cloud Advisory</title>
<meta name="description" content="42NAV is an independent advisory practice for telecom operators, hyperscalers, and mobility programs — network architecture, cloud &amp; edge strategy, and AI-driven automation.">
<style>
  :root{
    --bg:#0a0e14;
    --bg-alt:#0f151f;
    --panel:#131a26;
    --border:#1f2937;
    --text:#e6ebf1;
    --text-dim:#9aa7b8;
    --accent:#3dd6c6;
    --accent-2:#5b8cff;
    --accent-soft:rgba(61,214,198,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;}
  a{color:inherit;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  /* NAV */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,14,20,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:72px;}
  .logo{font-weight:800;font-size:1.15rem;letter-spacing:0.02em;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
  .navlinks{display:flex;gap:32px;font-size:0.92rem;color:var(--text-dim);}
  .navlinks a{text-decoration:none;transition:color .15s;}
  .navlinks a:hover{color:var(--text);}
  .nav-cta{
    background:var(--accent);color:#04211d;padding:9px 18px;border-radius:8px;
    font-weight:600;font-size:0.88rem;text-decoration:none;white-space:nowrap;
  }
  .navlinks-mobile-hide{display:flex;}
  @media (max-width:640px){
    .navlinks-mobile-hide{display:none;}
  }

  /* HERO */
  .hero{
    padding:96px 0 88px;
    background:
      radial-gradient(circle at 15% 20%, rgba(61,214,198,0.10), transparent 45%),
      radial-gradient(circle at 85% 0%, rgba(91,140,255,0.12), transparent 40%);
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    display:inline-block;font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border:1px solid rgba(61,214,198,0.35);
    padding:6px 14px;border-radius:999px;margin-bottom:22px;font-weight:600;
  }
  h1{
    font-size:clamp(2.1rem,5vw,3.4rem);
    line-height:1.12;
    font-weight:800;
    letter-spacing:-0.01em;
    max-width:820px;
  }
  h1 .accent{color:var(--accent);}
  .lede{
    margin-top:22px;font-size:1.15rem;color:var(--text-dim);max-width:640px;
  }
  .hero-ctas{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;}
  .btn-primary{
    background:var(--accent);color:#04211d;padding:13px 26px;border-radius:8px;
    font-weight:700;text-decoration:none;font-size:0.96rem;transition:transform .15s, box-shadow .15s;
    box-shadow:0 0 0 rgba(61,214,198,0);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(61,214,198,0.25);}
  .btn-secondary{
    border:1px solid var(--border);color:var(--text);padding:13px 26px;border-radius:8px;
    font-weight:600;text-decoration:none;font-size:0.96rem;transition:border-color .15s,background .15s;
  }
  .btn-secondary:hover{border-color:var(--accent);background:rgba(61,214,198,0.06);}

  /* STATS */
  .stats{border-bottom:1px solid var(--border);background:var(--bg-alt);}
  .stats-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:44px 0;
  }
  .stat b{display:block;font-size:1.9rem;font-weight:800;color:var(--text);}
  .stat span{font-size:0.85rem;color:var(--text-dim);}
  @media (max-width:760px){
    .stats-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* SECTION HEADERS */
  section{padding:88px 0;}
  .section-head{max-width:620px;margin-bottom:52px;}
  .kicker{
    font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-2);
    font-weight:700;margin-bottom:12px;
  }
  h2{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:800;letter-spacing:-0.01em;}
  .section-head p{margin-top:14px;color:var(--text-dim);font-size:1.05rem;}

  /* SERVICES */
  .services{background:var(--bg-alt);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:620px){.svc-grid{grid-template-columns:1fr;}}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 26px;
    transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:rgba(61,214,198,0.4);transform:translateY(-2px);}
  .card .icon{
    width:38px;height:38px;border-radius:10px;background:var(--accent-soft);
